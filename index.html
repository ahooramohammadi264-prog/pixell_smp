<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel SMP</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: 64px;
      margin-bottom: 15px;
      background: linear-gradient(90deg, #8a2be2, #c77dff, #8a2be2);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradient 4s linear infinite;
    }

    .subtitle {
      color: #aaa;
      font-size: 20px;
      margin-bottom: 35px;
    }

    .server-box {
      background: #15151d;
      border: 1px solid #292936;
      padding: 25px;
      border-radius: 15px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 0 30px rgba(138, 43, 226, 0.15);
    }

    .ip {
      font-size: 20px;
      color: #c77dff;
      margin-bottom: 18px;
      word-break: break-all;
    }

    button {
      border: none;
      padding: 13px 25px;
      border-radius: 10px;
      background: linear-gradient(90deg, #8a2be2, #a855f7);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
    }

    section {
      padding: 80px 30px;
      text-align: center;
    }

    .section-title {
      font-size: 35px;
      margin-bottom: 35px;
      color: #c77dff;
    }

    .developers {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      max-width: 1000px;
      margin: auto;
    }

    .developer-card {
      background: #15151d;
      border: 1px solid #292936;
      border-radius: 15px;
      padding: 25px;
      width: 280px;
      transition: 0.25s;
    }

    .developer-card:hover {
      transform: translateY(-6px);
      border-color: #8a2be2;
      box-shadow: 0 0 25px rgba(138, 43, 226, 0.2);
    }

    .developer-name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 18px;
      color: white;
    }

    .developer-card a {
      display: inline-block;
      text-decoration: none;
      color: #c77dff;
      border: 1px solid #8a2be2;
      padding: 10px 16px;
      border-radius: 8px;
      transition: 0.2s;
    }

    .developer-card a:hover {
      background: #8a2be2;
      color: white;
    }

    .inspiration {
      padding: 35px 20px 60px;
      text-align: center;
    }

    .inspiration p {
      color: #777;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .inspiration a {
      color: #9b5de5;
      text-decoration: none;
      font-size: 14px;
    }

    .inspiration a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #555;
      font-size: 13px;
    }

    @keyframes gradient {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 42px;
      }

      .subtitle {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <div class="hero">
    <h1>Welcome to Pixel SMP</h1>

    <p class="subtitle">
      Your Minecraft adventure starts here.
    </p>

    <div class="server-box">
      <div class="ip" id="serverIP">
        gold.magmanode.com:25955
      </div>

      <button onclick="copyIP()">
        Copy Server IP
      </button>
    </div>
  </div>


  <section>
    <h2 class="section-title">Contact Developers</h2>

    <div class="developers">

      <div class="developer-card">
        <div class="developer-name">
          ahoOr_XD
        </div>

        <a href="https://web.bale.ai/profile?uid=1201198957"
           target="_blank">
          Contact on Bale
        </a>
      </div>


      <div class="developer-card">
        <div class="developer-name">
          sinair
        </div>

        <a href="https://web.bale.ai/chat?uid=1706129239"
           target="_blank">
          Contact on Bale
        </a>
      </div>


      <div class="developer-card">
        <div class="developer-name">
          itz_samyar
        </div>

        <a href="https://web.bale.ai/chat?uid=757848872"
           target="_blank">
          Contact on Bale
        </a>
      </div>

    </div>
  </section>


  <div class="inspiration">

    <p>
      Pixel SMP was inspired by a server called Ucraft.
    </p>

    <a href="https://play.ucraft.ir" target="_blank">
      Ucraft IP: play.ucraft.ir
    </a>

  </div>


  <footer>
    © 2026 Pixel SMP
  </footer>


  <script>
    function copyIP() {
      const ip = "gold.magmanode.com:25955";

      navigator.clipboard.writeText(ip).then(() => {
        const button = document.querySelector("button");

        button.textContent = "Copied!";

        setTimeout(() => {
          button.textContent = "Copy Server IP";
        }, 1500);
      });
    }
  </script>

</body>
</html>
